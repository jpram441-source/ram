<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div><b id="myName"></b> <span id="myRole" class="badge"></span><br><small id="myClassInfo"></small></div><button onclick="logout()" class="btn-danger-sm">Logout</button></header><div style="max-width:1100px;margin:auto;padding:16px"><div class="nav-links"><a href="dashboard.html" class="active">Home</a><a href="users.html" id="navUsers">Users</a><a href="assignments.html">Assignments</a><a href="quizzes.html">Quiz & Books</a><a href="student.html" id="navStudent">My Learning</a></div></div><div class="container"><div class="card full-width"><h3>Welcome - GHSS Silattur</h3><div id="stats"></div></div><div class="card"><h3>Quick Actions</h3><div id="quick"></div></div><div class="card"><h3>Recent Assignments</h3><div id="recent"></div></div></div><script src="js/db.js"></script><script src="js/auth.js"></script><script>let user=requireLogin();myName.innerText=user.name;myRole.innerText=user.role;myRole.className='badge '+user.role;myClassInfo.innerText=user.class+' | '+user.emis;if(user.role==='student')navUsers.style.display='none';if(user.role!=='student')navStudent.style.display='none';stats.innerHTML=`Users: ${users.length} | Assignments: ${assignments.length} | Quizzes: ${quizzes.length} | Books: ${Object.keys(books).length}`;recent.innerHTML=assignments.slice(-3).reverse().map(a=>`<div class="quiz-q"><b>${a.class}-${a.subject}</b>: ${a.title}</div>`).join('')||'No data';let h='';if(user.role!=='student')h=`<a href="users.html" class="btn-primary" style="display:inline-block;width:auto;padding:8px 14px;text-decoration:none">Create User</a> <a href="quizzes.html" class="btn-primary" style="display:inline-block;width:auto;background:#10b981;text-decoration:none">Upload Book</a>`;else h=`<a href="student.html" class="btn-primary" style="display:inline-block;width:auto;text-decoration:none">Go Learning</a>`;quick.innerHTML=h;</script></body></html>
