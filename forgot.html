<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Forgot</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;font-family:Arial;background:#eef2ff;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#fff;padding:30px;border-radius:16px;width:380px;box-shadow:0 10px 30px rgba(0,0,0,.1)}input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc}button{width:100%;padding:12px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.password-wrapper{position:relative;display:flex;align-items:center}.eye-icon{position:absolute;right:12px;cursor:pointer}</style></head><body>
<div class="card"><h2>Reset Password</h2><input id="f_user" placeholder="Username / EMIS"><div class="password-wrapper"><input type="password" id="f_newpass" placeholder="New Password"><span class="eye-icon" onclick="document.getElementById('f_newpass').type=document.getElementById('f_newpass').type==='password'?'text':'password'">👁️</span></div><button onclick="resetPassword()">Reset</button><div style="text-align:center;margin-top:10px"><a href="index.html">Back to Login</a></div></div>
<script>function getUsers(){return JSON.parse(localStorage.getItem("users")||"[]");}function saveUsers(d){localStorage.setItem("users",JSON.stringify(d));}function resetPassword(){const u=document.getElementById("f_user").value.trim();const p=document.getElementById("f_newpass").value.trim();let users=getUsers();const i=users.findIndex(x=>x.username===u||x.emis===u);if(i>-1&&p.length>=4){users[i].password=p;saveUsers(users);alert("Password Reset Successful");location.href="index.html";}else{alert("User not found or password too short");}}</script>
</body></html>
