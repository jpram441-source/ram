<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot</title><link rel="stylesheet" href="css/style.css"></head><body class="center-page"><div class="login-card"><h2>Reset Password</h2><input type="text" id="f_user" placeholder="Username / EMIS"><div class="pass-wrap"><input type="password" id="f_newpass" placeholder="New Password"><span class="eye" onclick="togglePass('f_newpass')">👁️</span></div><button onclick="resetPassword()" class="btn-primary">Submit</button><a href="index.html" class="link">Back to Login</a><p id="msg" style="text-align:center;font-weight:bold;margin-top:10px"></p></div><script src="js/db.js"></script><script src="js/auth.js"></script><script>function resetPassword(){let u=f_user.value.trim(),p=f_newpass.value.trim();if(!u||!p){msg.innerText='Fill all';msg.style.color='red';return;}let i=users.findIndex(x=>x.username===u||x.emis===u);if(i==-1){msg.innerText='User not found';msg.style.color='red';return;}users[i].password=p;saveAll();msg.innerText='Success!';msg.style.color='green';setTimeout(()=>location.href='index.html',1000);}</script></body></html>
