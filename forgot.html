<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - GHSS Silattur</title>
<link rel="stylesheet" href="css/style.css">
<style>
.forgot-body{margin:0;font-family:Arial,sans-serif;background:#eef2ff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.forgot-card{background:#fff;padding:30px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.forgot-card h2{text-align:center;color:#4f46e5;margin-bottom:20px}
.forgot-card input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #ccc;font-size:14px}
.forgot-card button{width:100%;padding:12px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px}
.forgot-card button:hover{background:#4338ca}
.password-wrapper{position:relative;display:flex;align-items:center}
.eye-icon{position:absolute;right:12px;cursor:pointer;user-select:none}
.back-link{text-align:center;margin-top:15px}
.back-link a{color:#4f46e5;text-decoration:none;font-weight:bold}
</style>
</head>
<body class="forgot-body">
<div class="forgot-card">
<h2>Reset Password</h2>
<p style="text-align:center;font-size:13px;color:#666">Enter Username / EMIS to reset password</p>
<input type="text" id="f_user" placeholder="Username / EMIS Number">
<div class="password-wrapper">
<input type="password" id="f_newpass" placeholder="New Password (min 4 chars)">
<span class="eye-icon" onclick="togglePass()">👁️</span>
</div>
<button onclick="resetPassword()">Reset Password</button>
<div class="back-link"><a href="index.html">← Back to Login</a></div>
<p id="msg" style="text-align:center;margin-top:10px"></p>
</div>

<script src="js/db.js"></script>
<script>
function togglePass(){
const el=document.getElementById("f_newpass");
el.type = el.type==="password"? "text" : "password";
}
function resetPassword(){
const userInput=document.getElementById("f_user").value.trim();
const newPass=document.getElementById("f_newpass").value.trim();
const msgEl=document.getElementById("msg");
if(!userInput ||!newPass){msgEl.innerText="Please fill all fields"; msgEl.style.color="red"; return;}
if(newPass.length < 4){msgEl.innerText="Password must be at least 4 characters"; msgEl.style.color="red"; return;}
let users=getUsers();
const idx=users.findIndex(u=> u.username===userInput || u.emis===userInput);
if(idx===-1){msgEl.innerText="User not found with Username/EMIS"; msgEl.style.color="red"; return;}
users[idx].password = newPass;
saveUsers(users);
msgEl.innerText="Password Reset Successful! Redirecting to Login...";
msgEl.style.color="green";
setTimeout(()=>{window.location.href="index.html";},1500);
}
</script>
</body>
</html>
