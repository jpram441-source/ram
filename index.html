<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHSS Silattur - School Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loginPage" class="card">
  <h2>GHSS Silattur - Login</h2>
  <select id="role"><option value="owner">Owner</option><option value="teacher">Teacher</option><option value="student">Student</option></select>
  <input type="text" id="username" placeholder="Username / EMIS Number">
  <div class="password-wrapper"><input type="password" id="password" placeholder="Password"><span class="eye-icon" onclick="togglePassword('password')">👁️</span></div>
  <button onclick="login()">Login</button>
  <div class="link-center"><a href="forgot.html">Forgot Password?</a></div>
  <p id="error" class="error-msg"></p>
</div>
<div id="dashboardPage" class="dashboard-card" style="display:none;">
  <div class="header"><h2 id="welcomeText"></h2><button onclick="logout()" class="logout-btn">Logout</button></div>
  <div id="createSection">
    <div class="grid">
      <div class="card small">
        <h3 id="createTitle">Create User</h3>
        <input type="hidden" id="edit_user_id">
        <input type="text" id="new_name" placeholder="Full Name">
        <input type="text" id="new_username" placeholder="Username (Owner/Teacher)">
        <input type="text" id="new_emis" placeholder="EMIS Number (Student)">
        <select id="new_class"></select>
        <div class="password-wrapper"><input type="password" id="new_pass" placeholder="Password"><span class="eye-icon" onclick="togglePassword('new_pass')">👁️</span></div>
        <select id="new_role"></select>
        <button onclick="createUser()" id="createUserBtn">Create User</button>
        <button onclick="cancelEditUser()" id="cancelUserBtn" style="display:none;background:#6b7280">Cancel Edit</button>
      </div>
      <div class="card small">
        <h3>Assignment</h3><input type="hidden" id="edit_ass_id">
        <input type="text" id="ass_title" placeholder="Title"><textarea id="ass_desc" placeholder="Description"></textarea>
        <select id="ass_class"></select><select id="ass_subject"></select>
        <button onclick="addAssignment()" id="assBtn">Add Assignment</button><button onclick="cancelEditAss()" id="cancelAssBtn" style="display:none;background:#6b7280">Cancel</button>
        <hr><h3>Quiz - Auto / Manual</h3><input type="hidden" id="edit_quiz_id">
        <select id="quiz_class"></select><select id="quiz_sub"></select>
        <input type="text" id="quiz_topic" placeholder="Topic for Auto (Ex: Photosynthesis)"><input type="number" id="quiz_count" value="5" min="1" max="10">
        <button onclick="autoGenerateQuiz()" style="background:#059669">🤖 Auto Generate from Topic</button><hr>
        <input type="text" id="quiz_q" placeholder="Question Manual"><input type="text" id="quiz_opt" placeholder="Options A,B,C,D"><input type="text" id="quiz_ans" placeholder="Correct Answer">
        <button onclick="addQuiz()" id="quizBtn">Add Quiz Manual</button><button onclick="cancelEditQuiz()" id="cancelQuizBtn" style="display:none;background:#6b7280">Cancel Edit</button>
      </div>
    </div>
    <h3>Users - Edit/Delete</h3><div style="display:flex;gap:10px;margin-bottom:10px;"><select id="filterUserClass" onchange="loadUsers()"></select><select id="filterUserRole" onchange="loadUsers()"><option value="">All Roles</option><option value="owner">Owner</option><option value="teacher">Teacher</option><option value="student">Student</option></select></div><div id="userList"></div>
  </div>
  <div class="card small" style="width:100%;margin-top:20px;"><h3>Assignments - Edit/Delete</h3><div style="display:flex;gap:10px;margin-bottom:10px;"><select id="filterAssClass" onchange="loadAssignments()"></select><select id="filterAssSubject" onchange="loadAssignments()"></select></div><div id="assList"></div></div>
  <div class="card small" style="width:100%;margin-top:20px;"><h3>Quiz Bank - Edit/Delete</h3><div style="display:flex;gap:10px;margin-bottom:10px;"><select id="filterQuizClass" onchange="loadQuizBank()"></select><select id="filterQuizSubject" onchange="loadQuizBank()"></select></div><div id="quizBankList"></div></div>
  <div id="studentSection" class="card small" style="width:100%;margin-top:20px;"><h3>Weekly Quiz (One Time Per Week)</h3><select id="subjectFilter" onchange="loadQuiz()"></select><div id="quizArea"></div><div id="quizResult"></div><h4>My History</h4><div id="quizHistory"></div></div>
</div>
<script src="js/db.js"></script>
<script>
const ALL_CLASSES=["6th","7th","8th","9th","10th","11th A","11th B","11th B1","11th C","12th A","12th B","12th B1","12th C"];
const SUBJECTS_6_10=["Tamil","English","Maths","Science","Social Science"];
const SUBJECTS_11_12=["Tamil","English","Maths","Physics","Chemistry","Computer Science","Biology (Botany)","Biology (Zoology)"];
function getSubjectsByClass(cls){if(!cls)return [...new Set([...SUBJECTS_6_10,...SUBJECTS_11_12])];if(["6th","7th","8th","9th","10th"].includes(cls))return SUBJECTS_6_10;return SUBJECTS_11_12;}
let currentUser=null;
function togglePassword(id){const i=document.getElementById(id);i.type=i.type==="password"?"text":"password";}
function fillClassDropdowns(){["new_class","ass_class","quiz_class","filterUserClass","filterAssClass","filterQuizClass"].forEach(id=>{const el=document.getElementById(id);if(!el)return;const isF=id.startsWith("filter");el.innerHTML=(isF?`<option value="">All Classes</option>`:`<option value="">Select Class</option>`)+ALL_CLASSES.map(c=>`<option value="${c}">${c}</option>`).join('');});fillSubjectDropdowns();}
function fillSubjectDropdowns(){const assClass=document.getElementById("ass_class").value;const quizClass=document.getElementById("quiz_class").value;document.getElementById("ass_subject").innerHTML=`<option value="">Select Subject</option>`+getSubjectsByClass(assClass).map(s=>`<option value="${s}">${s}</option>`).join('');document.getElementById("quiz_sub").innerHTML=`<option value="">Select Subject</option>`+getSubjectsByClass(quizClass).map(s=>`<option value="${s}">${s}</option>`).join('');const allSub=[...new Set([...SUBJECTS_6_10,...SUBJECTS_11_12])];const f1=document.getElementById("filterAssSubject");if(f1)f1.innerHTML=`<option value="">All Subjects</option>`+allSub.map(s=>`<option>${s}</option>`).join('');const f2=document.getElementById("filterQuizSubject");if(f2)f2.innerHTML=`<option value="">All Subjects</option>`+allSub.map(s=>`<option>${s}</option>`).join('');}
function login(){const role=document.getElementById("role").value;const u=document.getElementById("username").value.trim();const p=document.getElementById("password").value.trim();const users=getUsers();let f=null;if(role==="student")f=users.find(x=>x.emis===u&&x.password===p&&x.role==="student");else f=users.find(x=>x.username===u&&x.password===p&&x.role===role);if(!f){document.getElementById("error").innerText="Invalid Username/EMIS or Password";return;}localStorage.setItem("currentUser",JSON.stringify(f));showDashboard();}
function showDashboard(){currentUser=JSON.parse(localStorage.getItem("currentUser"));if(!currentUser)return;document.getElementById("loginPage").style.display="none";document.getElementById("dashboardPage").style.display="block";document.getElementById("welcomeText").innerText=`Welcome ${currentUser.name} (${currentUser.role}) ${currentUser.className||''}`;fillClassDropdowns();const rs=document.getElementById("new_role");if(currentUser.role==="owner"){rs.innerHTML=`<option value="owner">Owner</option><option value="teacher">Teacher</option><option value="student">Student</option>`;document.getElementById("studentSection").style.display="none";}else if(currentUser.role==="teacher"){rs.innerHTML=`<option value="student">Student</option>`;document.getElementById("studentSection").style.display="none";}else{document.getElementById("createSection").style.display="none";document.getElementById("studentSection").style.display="block";const subs=getSubjectsByClass(currentUser.className);document.getElementById("subjectFilter").innerHTML=`<option value="">Select Subject</option>`+subs.map(s=>`<option value="${s}">${s}</option>`).join('');}document.getElementById("ass_class").addEventListener("change",fillSubjectDropdowns);document.getElementById("quiz_class").addEventListener("change",fillSubjectDropdowns);loadUsers();loadAssignments();loadQuizBank();loadHistory();}
function createUser(){const editId=document.getElementById("edit_user_id").value;const name=document.getElementById("new_name").value.trim();const username=document.getElementById("new_username").value.trim();const emis=document.getElementById("new_emis").value.trim();const className=document.getElementById("new_class").value;const pass=document.getElementById("new_pass").value.trim();const role=document.getElementById("new_role").value;if(!name||!pass){alert("Name Password required");return;}if(role!=="student"&&!username){alert("Username required");return;}if(role==="student"&&!emis){alert("EMIS required");return;}if(role==="student"&&!className){alert("Class required");return;}let users=getUsers();if(editId){const i=users.findIndex(u=>u.id==editId);if(i>-1)users[i]={...users[i],name,username:username||emis,emis,className,password:pass,role};saveUsers(users);alert("User Updated");}else{users.push({id:Date.now(),name,username:username||emis,emis,className,password:pass,role});saveUsers(users);alert(role+" created");}clearUserForm();loadUsers();}
function editUser(id){const u=getUsers().find(x=>x.id==id);if(!u)return;document.getElementById("edit_user_id").value=u.id;document.getElementById("new_name").value=u.name;document.getElementById("new_username").value=u.username;document.getElementById("new_emis").value=u.emis;document.getElementById("new_class").value=u.className||"";document.getElementById("new_pass").value=u.password;document.getElementById("new_role").value=u.role;document.getElementById("createUserBtn").innerText="Update User";document.getElementById("cancelUserBtn").style.display="block";}
function deleteUser(id){if(!confirm("Delete user?"))return;saveUsers(getUsers().filter(u=>u.id!=id));loadUsers();}
function clearUserForm(){document.getElementById("edit_user_id").value="";document.getElementById("new_name").value="";document.getElementById("new_username").value="";document.getElementById("new_emis").value="";document.getElementById("new_class").value="";document.getElementById("new_pass").value="";document.getElementById("createUserBtn").innerText="Create User";document.getElementById("cancelUserBtn").style.display="none";}
function cancelEditUser(){clearUserForm();}
function loadUsers(){let users=getUsers();const fc=document.getElementById("filterUserClass")?.value;const fr=document.getElementById("filterUserRole")?.value;if(currentUser.role==="teacher")users=users.filter(u=>u.role==="student");if(fc)users=users.filter(u=>u.className===fc);if(fr)users=users.filter(u=>u.role===fr);document.getElementById("userList").innerHTML=users.map(u=>`<div class="list-item"><div><b>${u.name}</b> - ${u.role} ${u.className?'- '+u.className:''}<br><small>${u.emis?'EMIS:'+u.emis:'User:'+u.username}</small></div><div style="display:flex;gap:6px"><span class="badge ${u.role}">${u.role}</span><button onclick="editUser('${u.id}')" style="width:auto;padding:6px 10px;background:#3b82f6">Edit</button><button onclick="deleteUser('${u.id}')" style="width:auto;padding:6px 10px;background:#ef4444">Delete</button></div></div>`).join('');}
function addAssignment(){const eid=document.getElementById("edit_ass_id").value;const t=document.getElementById("ass_title").value.trim();const d=document.getElementById("ass_desc").value.trim();const c=document.getElementById("ass_class").value;const s=document.getElementById("ass_subject").value;if(!t||!c||!s){alert("Title Class Subject required");return;}const list=getAssignments();if(eid){const i=list.findIndex(a=>a.id==eid);if(i>-1)list[i]={...list[i],title:t,desc:d,className:c,subject:s};saveAssignments(list);alert("Assignment Updated");}else{list.push({id:Date.now(),title:t,desc:d,className:c,subject:s,by:currentUser.name,date:new Date().toLocaleDateString()});saveAssignments(list);alert("Assignment Added");}clearAssForm();loadAssignments();}
function editAssignment(id){const a=getAssignments().find(x=>x.id==id);if(!a)return;document.getElementById("edit_ass_id").value=a.id;document.getElementById("ass_title").value=a.title;document.getElementById("ass_desc").value=a.desc;document.getElementById("ass_class").value=a.className;fillSubjectDropdowns();document.getElementById("ass_subject").value=a.subject;document.getElementById("assBtn").innerText="Update Assignment";document.getElementById("cancelAssBtn").style.display="block";}
function deleteAssignment(id){if(!confirm("Delete assignment?"))return;saveAssignments(getAssignments().filter(a=>a.id!=id));loadAssignments();}
function clearAssForm(){document.getElementById("edit_ass_id").value="";document.getElementById("ass_title").value="";document.getElementById("ass_desc").value="";document.getElementById("ass_class").value="";document.getElementById("ass_subject").value="";document.getElementById("assBtn").innerText="Add Assignment";document.getElementById("cancelAssBtn").style.display="none";}
function cancelEditAss(){clearAssForm();}
function loadAssignments(){let list=getAssignments();const fc=document.getElementById("filterAssClass")?.value;const fs=document.getElementById("filterAssSubject")?.value;if(currentUser.role==="student"&&currentUser.className)list=list.filter(a=>a.className===currentUser.className);if(fc)list=list.filter(a=>a.className===fc);if(fs)list=list.filter(a=>a.subject===fs);document.getElementById("assList").innerHTML=list.length===0?"<p>No assignments</p>":list.map(a=>`<div class="list-item"><div><b>${a.title}</b> [${a.className}-${a.subject}]<br><small>${a.desc}</small><br><small>By ${a.by} on ${a.date}</small></div>${currentUser.role!=="student"?`<div style="display:flex;gap:6px"><button onclick="editAssignment('${a.id}')" style="width:auto;padding:6px 10px;background:#3b82f6">Edit</button><button onclick="deleteAssignment('${a.id}')" style="width:auto;padding:6px 10px;background:#ef4444">Delete</button></div>`:''}</div>`).join('');}
function addQuiz(){const eid=document.getElementById("edit_quiz_id").value;const c=document.getElementById("quiz_class").value;const s=document.getElementById("quiz_sub").value;const q=document.getElementById("quiz_q").value.trim();const opts=document.getElementById("quiz_opt").value.split(',').map(x=>x.trim()).filter(x=>x);const ans=document.getElementById("quiz_ans").value.trim();if(!c||!s||!q||opts.length<2||!ans){alert("Class Subject Question Options Answer required");return;}const list=getQuizzes();if(eid){const i=list.findIndex(x=>x.id==eid);if(i>-1)list[i]={...list[i],className:c,subject:s,question:q,options:opts,answer:ans};saveQuizzes(list);alert("Quiz Updated");}else{list.push({id:Date.now(),className:c,subject:s,question:q,options:opts,answer:ans});saveQuizzes(list);alert("Quiz Added");}clearQuizForm();loadQuizBank();}
function editQuiz(id){const q=getQuizzes().find(x=>x.id==id);if(!q)return;document.getElementById("edit_quiz_id").value=q.id;document.getElementById("quiz_class").value=q.className;fillSubjectDropdowns();document.getElementById("quiz_sub").value=q.subject;document.getElementById("quiz_q").value=q.question;document.getElementById("quiz_opt").value=q.options.join(',');document.getElementById("quiz_ans").value=q.answer;document.getElementById("quizBtn").innerText="Update Quiz";document.getElementById("cancelQuizBtn").style.display="block";}
function deleteQuiz(id){if(!confirm("Delete quiz?"))return;saveQuizzes(getQuizzes().filter(q=>q.id!=id));loadQuizBank();}
function clearQuizForm(){document.getElementById("edit_quiz_id").value="";document.getElementById("quiz_q").value="";document.getElementById("quiz_opt").value="";document.getElementById("quiz_ans").value="";document.getElementById("quizBtn").innerText="Add Quiz Manually";document.getElementById("cancelQuizBtn").style.display="none";}
function cancelEditQuiz(){clearQuizForm();}
function loadQuizBank(){let list=getQuizzes();const fc=document.getElementById("filterQuizClass")?.value;const fs=document.getElementById("filterQuizSubject")?.value;if(fc)list=list.filter(q=>q.className===fc);if(fs)list=list.filter(q=>q.subject===fs);if(currentUser.role==="student"&&currentUser.className)list=list.filter(q=>q.className===currentUser.className);document.getElementById("quizBankList").innerHTML=list.length===0?"<p>No quiz</p>":list.map(q=>`<div class="list-item"><div><b>[${q.className}-${q.subject}] ${q.question}</b><br><small>Options: ${q.options.join(',')} | Ans: ${q.answer}</small></div>${currentUser.role!=="student"?`<div style="display:flex;gap:6px"><button onclick="editQuiz('${q.id}')" style="width:auto;padding:6px 10px;background:#3b82f6">Edit</button><button onclick="deleteQuiz('${q.id}')" style="width:auto;padding:6px 10px;background:#ef4444">Delete</button></div>`:''}</div>`).join('');}
function autoGenerateQuiz(){const c=document.getElementById("quiz_class").value;const s=document.getElementById("quiz_sub").value;const topic=document.getElementById("quiz_topic").value.trim();const cnt=parseInt(document.getElementById("quiz_count").value)||5;if(!c||!s||!topic){alert("Class Subject Topic required");return;}const bank={Tamil:[`"${topic}" - vinai chol?`,`"${topic}" seiyul la enna?`],English:[`Synonym of ${topic}?`,`Antonym of ${topic}?`],Maths:[`What is formula of ${topic}?`,`If ${topic}=10 find value?`],Science:[`What is ${topic}?`,`Which part is ${topic}?`],Physics:[`Unit of ${topic}?`,`Law of ${topic}?`],Chemistry:[`Formula of ${topic}?`,`${topic} belongs to which group?`]};let list=getQuizzes();for(let i=0;i<cnt;i++){let q=`What is ${topic} in ${s}?`;let opts=[`${topic} concept`,`Not related`,`Random`,`None`];let ans=`${topic} concept`;if(bank[s]){q=bank[s][i%bank[s].length];}list.push({id:Date.now()+i,className:c,subject:s,question:q,options:opts,answer:ans});}saveQuizzes(list);alert(cnt+" Questions Generated for "+topic);loadQuizBank();document.getElementById("quiz_topic").value="";}
function getWeekId(){const n=new Date();return `${n.getFullYear()}-${n.getMonth()}-${Math.ceil(n.getDate()/7)}`;}
function loadQuiz(){const sub=document.getElementById("subjectFilter").value;if(!sub)return;const week=getWeekId();const atts=getAttempts();const already=atts.find(a=>a.emis===currentUser.emis&&a.subject===sub&&a.week===week);if(already){document.getElementById("quizArea").innerHTML=`<p class="success">Already attended ${sub} - Score ${already.score}/${already.total}</p>`;return;}let qs=getQuizzes().filter(q=>q.subject===sub&&q.className===currentUser.className);if(qs.length===0){document.getElementById("quizArea").innerHTML="<p>No quiz for this subject</p>";return;}qs=qs.slice(0,5);let h=`<form id="quizForm">`;qs.forEach((q,i)=>{h+=`<p><b>Q${i+1}: ${q.question}</b></p>`;q.options.forEach(o=>{h+=`<label><input type="radio" name="q${q.id}" value="${o}"> ${o}</label><br>`;});});h+=`<button type="button" onclick="submitQuiz()">Submit</button></form>`;document.getElementById("quizArea").innerHTML=h;}
function submitQuiz(){const sub=document.getElementById("subjectFilter").value;let qs=getQuizzes().filter(q=>q.subject===sub&&q.className===currentUser.className).slice(0,5);let score=0;qs.forEach(q=>{const sel=document.querySelector(`input[name="q${q.id}"]:checked`);if(sel&&sel.value.toLowerCase()===q.answer.toLowerCase())score++;});const atts=getAttempts();atts.push({emis:currentUser.emis,className:currentUser.className,subject:sub,week:getWeekId(),score,total:qs.length,date:new Date().toISOString()});saveAttempts(atts);document.getElementById("quizResult").innerHTML=`<h3>Score: ${score}/${qs.length}</h3>`;document.getElementById("quizArea").innerHTML="";loadHistory();}
function loadHistory(
