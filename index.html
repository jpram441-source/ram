<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHSS Silattur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginPage" class="card center">
  <h2>GHSS Silattur - Login</h2>
  <input id="uid" placeholder="Username / EMIS No">
  <input id="upass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="err" style="color:red"></p>
  <p id="forgotLink" style="display:none; margin-top:10px"><a href="#" onclick="showForgot()" style="color:#4f46e5; text-decoration:none">Password not remembered? Forgot Password?</a></p>
  <small>First Owner: <b>owner / owner123</b></small>
</div>

<div id="forgotPage" class="card center" style="display:none">
  <h3>Reset Password</h3>
  <input id="f_uid" placeholder="Username / EMIS No">
  <input id="f_newpass" type="password" placeholder="New Password">
  <button onclick="resetPassword()">Reset Password</button>
  <button onclick="backToLogin()" style="background:#6b7280; margin-top:6px">Back to Login</button>
  <p id="f_err" style="color:red"></p>
</div>

<div id="mainPage" style="display:none">
  <div class="card">
    <span>Hi <b id="myName"></b> <span id="myRole" class="badge"></span></span>
    <button onclick="logout()" style="float:right; width:auto; padding:6px 12px; background:#ef4444">Logout</button>
    <br><small id="myClass"></small>
  </div>

  <div id="id create" class="card" style="display:none; border-left:5px solid #ef4444">
    <h3>ID CREATE - <span id="editTitle">Create ID</span></h3>
    <input type="hidden" id="editIndex">
    <input id="o_name" placeholder="Full Name">
    <input id="o_id" placeholder="Username">
    <input id="o_pass" placeholder="Password">
    <select id="o_role"><option value="">Role Select</option><option value="owner">Owner</option><option value="teacher">Teacher</option><option value="student">Student</option></select>
    <input id="o_class" placeholder="Class (ex: 10th A)">
    <input id="o_emis" placeholder="EMIS Number">
    <button id="createBtn" onclick="createUser('owner')">Create ID</button>
    <button id="cancelBtn" onclick="cancelEdit()" style="display:none;background:#6b7280;margin-top:6px">Cancel Edit</button>
  </div>

  <div id="teachercontrol" class="card" style="display:none; border-left:5px solid #22c55e">
    <h3>TEACHER CONTROL - Student Add/Edit</h3>
    <input type="hidden" id="t_editIndex">
    <input id="t_name" placeholder="Student Name">
    <input id="t_id" placeholder="Student Username">
    <input id="t_pass" placeholder="Password">
    <input id="t_class" placeholder="Class">
    <input id="t_emis" placeholder="EMIS No">
    <button id="t_createBtn" onclick="createUser('teacher')">Add Student</button>
    <button id="t_cancelBtn" onclick="cancelEdit()" style="display:none;background:#6b7280;margin-top:6px">Cancel Edit
